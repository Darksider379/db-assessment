name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Regression tests with coverage
        run: pytest

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Audit for vulnerabilities (fail on critical/high)
        run: |
          pip-audit --format=json --output=audit.json
          jq -e '[.dependencies[].vulns[]? | select((.severity // "" | ascii_upcase) | IN("CRITICAL","HIGH"))] | length == 0' audit.json \
            || (echo "Critical/high vulnerabilities detected:" && jq '.dependencies[] | select(.vulns | length > 0)' audit.json && exit 1)
